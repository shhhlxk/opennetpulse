
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opennetpulse"
version = "0.1.0"
description = "Open-source network diagnostics and performance monitoring toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "OpenNetPulse Contributors" }
]
keywords = [
    "network-diagnostics",
    "network-monitoring",
    "latency",
    "dns",
    "http",
    "tcp",
    "network-performance"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking :: Monitoring"
]

dependencies = []

[project.scripts]
opennetpulse = "opennetpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
